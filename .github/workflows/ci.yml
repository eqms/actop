name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Default to read-only; the release job requests write access individually.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'

      # -race matters here: log streaming and the poll commands run on their
      # own goroutines and hand results to the update loop via messages.
      - name: Run tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11
          args: --timeout=5m

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          # actop targets macOS (Apple Container is macOS-only)
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=$(cat VERSION)
          BUILD=$(git rev-parse --short HEAD)
          go build \
            -ldflags "-w -X main.version=${VERSION} -X main.build=${BUILD}" \
            -o actop-${VERSION}-${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actop-${{ matrix.suffix }}
          path: actop-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
          pattern: actop-*

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum actop-* > sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: artifacts/*
          generate_release_notes: true

  homebrew:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Update formula in tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A secret pasted with a trailing newline passes a plain -z check and
          # then fails deep inside git with an unrelated-looking message. Strip
          # whitespace first, so a stray newline is tolerated and a truly empty
          # secret is reported as what it is. This bit the v0.5.0 release.
          TAP_TOKEN="$(printf '%s' "${TAP_TOKEN}" | tr -d '[:space:]')"
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is empty or whitespace-only — formula not updated"
            exit 1
          fi
          # Check the token before doing any work. Without this the job clones,
          # edits and commits, and only the push fails -- with "Invalid username
          # or token", which says nothing about which of the two is wrong.
          #
          # Branch on the HTTP status, never on curl's exit code: `curl -f`
          # collapses every failure into one, and the statuses mean genuinely
          # different things here. A fine-grained PAT reports a repository it
          # was not granted as 404, not 403 -- so "token has no access to the
          # tap" and "value is not a token at all" produced the identical
          # error message. That cost the v0.7.0 release a round of guessing.
          REPO_JSON="${RUNNER_TEMP}/tap-repo.json"
          HTTP=$(curl -sS -o "${REPO_JSON}" -w '%{http_code}' \
                   -H "Authorization: Bearer ${TAP_TOKEN}" \
                   -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/eqms/homebrew-tap" || echo 000)
          case "${HTTP}" in
            200) ;;
            401)
              echo "::error::HOMEBREW_TAP_TOKEN is not a valid token (HTTP 401) -- mistyped, expired or revoked. Classic PATs start with ghp_, fine-grained ones with github_pat_."
              exit 1 ;;
            403)
              echo "::error::HOMEBREW_TAP_TOKEN was refused (HTTP 403). The token is real but not permitted to read eqms/homebrew-tap -- check SSO authorisation and expiry."
              exit 1 ;;
            404)
              echo "::error::HOMEBREW_TAP_TOKEN cannot see eqms/homebrew-tap (HTTP 404). A fine-grained PAT reports repositories it was not granted as non-existent, so this almost certainly means the tap is missing from the token's 'Repository access' list -- the token itself is fine."
              exit 1 ;;
            000)
              echo "::error::Could not reach the GitHub API to verify HOMEBREW_TAP_TOKEN."
              exit 1 ;;
            *)
              echo "::error::Unexpected HTTP ${HTTP} while verifying HOMEBREW_TAP_TOKEN against eqms/homebrew-tap."
              exit 1 ;;
          esac
          if [ "$(jq -r '.permissions.push // false' "${REPO_JSON}")" != "true" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN can read eqms/homebrew-tap but not write to it. A classic PAT needs the 'repo' scope; a fine-grained one needs Contents: Read and write on that repository."
            exit 1
          fi
          URL="https://github.com/eqms/actop/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -fsSL "${URL}" | sha256sum | cut -d' ' -f1)
          # The tap is public, so the clone needs no credentials at all --
          # and an http.extraheader that GitHub rejects turns an anonymous
          # read into a 401, which is what broke the v0.6.0 run. Only the
          # push authenticates, via an explicit remote URL that is never
          # written to .git/config.
          git clone https://github.com/eqms/homebrew-tap.git tap
          cd tap
          # anchored checks: fail loudly if the formula diverged
          grep -q '^  url "' Formula/actop.rb
          grep -q '^  sha256 "' Formula/actop.rb
          sed -i "s|^  url \".*\"|  url \"${URL}\"|" Formula/actop.rb
          sed -i "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Formula/actop.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # idempotent: a re-run for an already-updated tag is a no-op, not a failure
          if git diff --quiet -- Formula/actop.rb; then
            echo "Formula already up to date for ${TAG} — nothing to commit"
          else
            git add Formula/actop.rb
            git commit -m "[CHG] actop ${TAG}: update formula"
            git push "https://x-access-token:${TAP_TOKEN}@github.com/eqms/homebrew-tap.git" HEAD:main
          fi
